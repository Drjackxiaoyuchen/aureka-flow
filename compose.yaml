services:
  flow:
    build: .
    ports:
      - "${AUREKA_PORT:-8080}:8080"
    environment:
      AUREKA_MAX_FILE_MB: ${AUREKA_MAX_FILE_MB:-100}
      AUREKA_SESSION_INPUT_MB: ${AUREKA_SESSION_INPUT_MB:-100}
      AUREKA_GLOBAL_INPUT_MB: ${AUREKA_GLOBAL_INPUT_MB:-256}
      AUREKA_MAX_SESSIONS: ${AUREKA_MAX_SESSIONS:-16}
      AUREKA_SESSION_TTL: ${AUREKA_SESSION_TTL:-3600}
      AUREKA_SECURE_COOKIES: ${AUREKA_SECURE_COOKIES:-0}
    restart: unless-stopped
