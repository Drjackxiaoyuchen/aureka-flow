[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aureka-flow"
version = "0.4.0"
description = "A browser flow-cytometry server for FCS visualization, manual gating, and downloadable analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Aureka Flow contributors"}]
dependencies = [
  "FlowKit==1.2.3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
validation = ["matplotlib>=3.8,<4"]
docs = ["matplotlib>=3.8,<4", "Markdown>=3.7,<4"]

[project.scripts]
aureka-flow = "aureka_flow.__main__:main"

[project.urls]
Repository = "https://github.com/Drjackxiaoyuchen/aureka-flow"
Issues = "https://github.com/Drjackxiaoyuchen/aureka-flow/issues"

[tool.setuptools]
packages = ["aureka_flow"]
include-package-data = true

[tool.setuptools.package-data]
aureka_flow = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
